<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Eastern Mass ADU Budget</title>
    <link rel="stylesheet" href="styles.css?v=15" />
  </head>
  <body>
    <section id="passwordGate" class="password-gate" aria-label="Budget sign in">
      <form id="passwordForm" class="password-panel">
        <p class="eyebrow">Private Budget</p>
        <h1>ADU Budget Builder</h1>
        <label>
          Password
          <input id="passwordInput" type="password" autocomplete="current-password" required />
        </label>
        <p id="passwordError" class="password-error" role="alert" hidden>Wrong password. Try again.</p>
        <button type="submit">Open Budget</button>
      </form>
    </section>

    <header class="topbar">
      <h1 id="topTitle">7 Jennifer budget</h1>
      <p id="topSubtitle"></p>
    </header>

    <main>
      <section class="cloud-band" aria-label="Cloud sync">
        <div class="cloud-auth" id="cloudSignedOut">
          <div class="control-group">
            <label for="cloudPassword">Cloud Password</label>
            <input id="cloudPassword" type="password" autocomplete="current-password" />
          </div>
          <button type="button" id="cloudSignIn">Unlock Cloud</button>
          <button type="button" id="cloudSignUp">Set Password</button>
        </div>
        <div class="cloud-auth is-hidden" id="cloudSignedIn">
          <div class="control-group">
            <label for="projectSelect">Cloud Project</label>
            <select id="projectSelect"></select>
          </div>
          <button type="button" id="newCloudProject">New Project</button>
          <button type="button" id="copyCloudProject">Duplicate</button>
          <button type="button" id="syncNow">Sync Now</button>
          <button type="button" id="cloudSignOut">Sign Out</button>
        </div>
        <p id="cloudStatus" class="cloud-status">Local only</p>
      </section>

      <section class="controls-band" aria-label="Budget controls">
        <div class="control-group">
          <label for="projectName">Project</label>
          <input id="projectName" type="text" value="7 Jennifer budget" />
        </div>
        <div class="control-group">
          <label for="contractValue">Contract Price</label>
          <input id="contractValue" type="number" step="0.01" min="0" />
        </div>
        <div class="control-group">
          <label for="viewFilter">View</label>
          <select id="viewFilter">
            <option value="all">All rows</option>
            <option value="risk">Risk or placeholder</option>
            <option value="quoted">Quoted / locked</option>
            <option value="materials">Rows with materials</option>
            <option value="labor">Rows with labor</option>
          </select>
        </div>
        <div class="control-group control-actions">
          <button type="button" id="addTopRow">Add Row</button>
          <button type="button" id="addTopGroup">Add Group</button>
          <p id="saveStatus" class="save-status" role="status">Saved</p>
        </div>
        <div class="control-group grow">
          <label>Columns</label>
          <div id="columnToggles" class="toggle-row"></div>
        </div>
      </section>

      <section class="budget-shell" aria-label="Budget table">
        <div class="table-header" id="tableHeader"></div>
        <div id="budgetRows" class="rows"></div>
      </section>

      <section class="bottom-summary" aria-label="Budget summary">
        <div>
          <span>Total Cost</span>
          <strong id="totalCost">$0</strong>
        </div>
        <div>
          <span>Contract Price</span>
          <strong id="contractPrice">$0</strong>
        </div>
        <div>
          <span>Profit</span>
          <strong id="profit">$0</strong>
        </div>
      </section>
    </main>

    <dialog id="editorDialog">
      <form id="editorForm">
        <div class="dialog-head">
          <h2 id="editorTitle">Edit Row</h2>
          <button type="button" id="closeDialog" class="icon-button" aria-label="Close">×</button>
        </div>
        <div class="form-grid">
          <label>
            Phase
            <select name="phase">
              <option>Site Work & Foundation</option>
              <option>Framing</option>
              <option>MEP</option>
              <option>Finish Work</option>
            </select>
          </label>
          <label>
            Nest Under
            <select name="parentId"></select>
          </label>
          <label>
            Trade / Scope
            <input name="scope" type="text" required />
          </label>
          <label>
            Sub / Vendor
            <input name="sub" type="text" />
          </label>
          <label>
            Status
            <select name="status">
              <option>Placeholder</option>
              <option>Estimated</option>
              <option>Quoted</option>
              <option>Selected</option>
              <option>Locked</option>
              <option>Ordered</option>
            </select>
          </label>
          <label>
            Risk
            <select name="risk">
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </label>
          <label>
            Cost Type
            <select name="costType">
              <option value="split">Labor and material</option>
              <option value="labor">Labor</option>
              <option value="material">Material</option>
            </select>
          </label>
          <label>
            Quantity
            <input name="qty" type="number" step="0.01" min="0" />
          </label>
          <label>
            Unit
            <input name="unit" type="text" />
          </label>
          <label>
            Unit Cost
            <input name="unitCost" type="number" step="0.01" min="0" />
          </label>
          <label>
            Labor Cost
            <input name="labor" type="number" step="0.01" min="0" />
          </label>
          <label>
            Material Cost
            <input name="material" type="number" step="0.01" min="0" />
          </label>
          <label class="wide">
            Notes
            <textarea name="notes" rows="3"></textarea>
          </label>
        </div>
        <menu>
          <button type="button" id="deleteRow" class="danger">Delete</button>
          <span></span>
          <button type="button" id="addGroup">Add Group</button>
          <button type="button" id="addItem">Add Item</button>
          <button value="cancel" type="button" id="cancelEdit">Cancel</button>
          <button type="submit" id="saveRow">Save</button>
        </menu>
      </form>
    </dialog>

    <dialog id="projectDialog">
      <form id="projectForm">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">New Project</p>
            <h2>Start From Template</h2>
          </div>
          <button type="button" id="closeProjectDialog" class="icon-button" aria-label="Close">×</button>
        </div>
        <div class="form-grid project-form-grid">
          <label>
            Project Name
            <input name="projectName" type="text" required />
          </label>
          <label>
            Contract Price
            <input name="contractValue" type="number" step="0.01" min="0" />
          </label>
          <label>
            Template
            <select name="template">
              <option value="standard">Eastern Mass ADU Standard</option>
            </select>
          </label>
          <label>
            Address
            <input name="address" type="text" />
          </label>
          <label>
            Client
            <input name="clientName" type="text" />
          </label>
          <label>
            Status
            <select name="status">
              <option>Planning</option>
              <option>Estimating</option>
              <option>Contracted</option>
              <option>In Progress</option>
              <option>Closeout</option>
            </select>
          </label>
          <label>
            Start Date
            <input name="startDate" type="date" />
          </label>
          <label>
            Target Finish
            <input name="targetFinishDate" type="date" />
          </label>
          <label class="wide">
            Notes
            <textarea name="notes" rows="3"></textarea>
          </label>
        </div>
        <menu class="dialog-actions">
          <span></span>
          <button value="cancel" type="button" id="cancelProject">Cancel</button>
          <button type="submit">Create Project</button>
        </menu>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="cloud-config.js"></script>
    <script src="app.js?v=25"></script>
  </body>
</html>
