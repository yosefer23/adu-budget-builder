<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Eastern Mass ADU Budget</title>
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <section id="passwordGate" class="password-gate" aria-label="Budget sign in">
      <form id="passwordForm" class="password-panel">
        <p class="eyebrow">Private Budget</p>
        <h1>ADU Budget Builder</h1>
        <label>
          Password
          <input id="passwordInput" type="password" autocomplete="current-password" required />
        </label>
        <p id="passwordError" class="password-error" role="alert" hidden>Wrong password. Try again.</p>
        <button type="submit">Open Budget</button>
      </form>
    </section>

    <header class="topbar">
      <div>
        <p class="eyebrow">Eastern Mass ADU</p>
        <h1>Fixed-Price Budget Builder</h1>
      </div>
      <div class="toolbar">
        <button id="expandAll" type="button" title="Expand all rows">Expand</button>
        <button id="collapseAll" type="button" title="Collapse all rows">Collapse</button>
        <button id="copyBudget" type="button" title="Copy this whole budget as a new project">Copy Budget</button>
        <button id="saveTemplate" type="button" title="Save this project as a reusable template">Save Template</button>
        <button id="resetDemo" type="button" class="ghost" title="Reset to the starter budget">Reset</button>
      </div>
    </header>

    <main>
      <section class="summary-grid" aria-label="Project summary">
        <label class="metric editable">
          <span>Contract Value</span>
          <input id="contractValue" type="number" min="0" step="500" value="322500" />
        </label>
        <div class="metric">
          <span>Total Cost</span>
          <strong id="totalCost">$258,530</strong>
        </div>
        <div class="metric">
          <span>Projected Profit</span>
          <strong id="profit">$63,970</strong>
        </div>
        <div class="metric">
          <span>Margin</span>
          <strong id="margin">19.8%</strong>
        </div>
        <div class="metric">
          <span>25% Target Gap</span>
          <strong id="targetGap">-$16,655</strong>
        </div>
      </section>

      <section class="controls-band" aria-label="Budget controls">
        <div class="control-group">
          <label for="projectName">Project</label>
          <input id="projectName" type="text" value="7 Jennifer Sub & Cost Planner" />
        </div>
        <div class="control-group">
          <label for="viewFilter">View</label>
          <select id="viewFilter">
            <option value="all">All rows</option>
            <option value="risk">Risk or placeholder</option>
            <option value="quoted">Quoted / locked</option>
            <option value="materials">Rows with materials</option>
            <option value="labor">Rows with labor</option>
          </select>
        </div>
        <div class="control-group grow">
          <label>Columns</label>
          <div id="columnToggles" class="toggle-row"></div>
        </div>
      </section>

      <section class="budget-shell" aria-label="Budget table">
        <div class="table-header" id="tableHeader"></div>
        <div id="budgetRows" class="rows"></div>
      </section>
    </main>

    <dialog id="editorDialog">
      <form method="dialog" id="editorForm">
        <div class="dialog-head">
          <h2 id="editorTitle">Edit Row</h2>
          <button type="button" id="closeDialog" class="icon-button" aria-label="Close">×</button>
        </div>
        <div class="form-grid">
          <label>
            Phase
            <input name="phase" type="text" />
          </label>
          <label>
            Trade / Scope
            <input name="scope" type="text" required />
          </label>
          <label>
            Sub / Vendor
            <input name="sub" type="text" />
          </label>
          <label>
            Status
            <select name="status">
              <option>Placeholder</option>
              <option>Estimated</option>
              <option>Quoted</option>
              <option>Selected</option>
              <option>Locked</option>
              <option>Ordered</option>
            </select>
          </label>
          <label>
            Risk
            <select name="risk">
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </label>
          <label>
            Cost Type
            <select name="costType">
              <option value="split">Labor and material</option>
              <option value="labor">Labor</option>
              <option value="material">Material</option>
            </select>
          </label>
          <label>
            Quantity
            <input name="qty" type="number" step="0.01" min="0" />
          </label>
          <label>
            Unit
            <input name="unit" type="text" />
          </label>
          <label>
            Unit Cost
            <input name="unitCost" type="number" step="0.01" min="0" />
          </label>
          <label>
            Labor Cost
            <input name="labor" type="number" step="0.01" min="0" />
          </label>
          <label>
            Material Cost
            <input name="material" type="number" step="0.01" min="0" />
          </label>
          <label class="wide">
            Notes
            <textarea name="notes" rows="3"></textarea>
          </label>
        </div>
        <menu>
          <button type="button" id="deleteRow" class="danger">Delete</button>
          <span></span>
          <button type="button" id="addGroup">Add Group</button>
          <button type="button" id="addItem">Add Item</button>
          <button value="cancel" type="button" id="cancelEdit">Cancel</button>
          <button value="default" id="saveRow">Save</button>
        </menu>
      </form>
    </dialog>

    <script src="app.js?v=4"></script>
  </body>
</html>
